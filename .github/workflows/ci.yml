name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          echo "Validating skills-kit repository structure..."

          # Verificar archivos esenciales
          required_files=("README.md" ".gitignore" ".gitattributes" "CHANGELOG.md")
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file exists"
            else
              echo "❌ $file missing"
              exit 1
            fi
          done

          # Verificar directorio skills
          if [ -d "skills" ]; then
            echo "✅ skills directory exists"
          else
            echo "❌ skills directory missing"
            exit 1
          fi

          # Layout esperado: skills/<categoria>/<skill>/SKILL.md
          skill_count=0

          for category_dir in skills/*/; do
            [ -d "$category_dir" ] || continue
            category=$(basename "$category_dir")

            # Un SKILL.md directo bajo skills/ significa layout plano: no se valida y rompe el contrato
            if [ -f "$category_dir/SKILL.md" ]; then
              echo "❌ $category: skills/<name>/SKILL.md is not allowed, use skills/<category>/<name>/SKILL.md"
              exit 1
            fi

            for skill_dir in "$category_dir"*/; do
              [ -d "$skill_dir" ] || continue
              skill_name=$(basename "$skill_dir")
              skill_count=$((skill_count + 1))

              if [ ! -f "$skill_dir/SKILL.md" ]; then
                echo "❌ $category/$skill_name missing SKILL.md"
                exit 1
              fi

              # El name del frontmatter debe coincidir con el nombre del directorio
              declared_name=$(sed -n 's/^name:[[:space:]]*//p' "$skill_dir/SKILL.md" | head -1 | tr -d '"'"'"'')
              if [ "$declared_name" != "$skill_name" ]; then
                echo "❌ $category/$skill_name: frontmatter name is '$declared_name'"
                exit 1
              fi

              echo "✅ $category/$skill_name"
            done
          done

          if [ "$skill_count" -eq 0 ]; then
            echo "❌ No skills found under skills/<category>/"
            exit 1
          fi

          echo "📁 Found $skill_count skills"
          echo "✅ Repository structure validation passed"

      - name: Check Markdown formatting
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          config-file: '.github/markdown-link-check.json'

  release:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from CHANGELOG
        id: get_version
        run: |
          if grep -q "## Unreleased" CHANGELOG.md; then
            echo "No new version to release (still Unreleased)"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -E '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1 | sed 's/## //' | awk '{print $1}')
            echo "Latest version: $VERSION"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: steps.get_version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
